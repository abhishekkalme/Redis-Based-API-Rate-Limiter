global:
  scrape_interval: 10s
  evaluation_interval: 10s

scrape_configs:
  - job_name: 'rate_limiter'
    static_configs:
      - targets:
          - 'app1:3000'
          - 'app2:3000'
          - 'app3:3000'
    metrics_path: '/metrics'
    relabel_configs:
      - source_labels: [__address__]
        target_label: instance
        regex: '([^:]+):.*'
        replacement: '$1'
