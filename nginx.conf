upstream rate_limiter_backend {
    least_conn;
    server app1:3000 weight=1;
    server app2:3000 weight=1;
    server app3:3000 weight=1;
}

server {
    listen 80;
    server_name localhost;

    location / {
        proxy_pass http://rate_limiter_backend;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_read_timeout 30s;
        proxy_connect_timeout 5s;

        # Rate limit status headers pass through
        proxy_pass_header RateLimit-Limit;
        proxy_pass_header RateLimit-Remaining;
        proxy_pass_header RateLimit-Reset;
    }
}
